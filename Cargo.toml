[package]
name = "clawd"
version = "3.0.0"
edition = "2024"
description = "Desktop pet that walks on your Linux desktop"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
x11rb = { version = "0.13", optional = true, features = ["shm", "shape"] }
wayland-client = { version = "0.31", optional = true }
# dropped: we go raw wayland-client
wayland-protocols = { version = "0.32", optional = true, features = ["client"] }
wayland-protocols-wlr = { version = "0.3", optional = true, features = ["client"] }
tempfile = "3.27.0"

[target.'cfg(not(windows))'.dependencies]
zbus = "5"
wl-clipboard-rs = "0.9"

[features]
default = ["host-x11", "host-wl"]
host-x11 = ["dep:x11rb"]
host-wl = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
